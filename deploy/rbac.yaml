apiVersion: v1
kind: ServiceAccount
metadata:
  name: saas-provisioner
  namespace: saas-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saas-provisioner
  namespace: saas-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: saas-provisioner
  namespace: saas-dev
subjects:
  - kind: ServiceAccount
    name: saas-provisioner
    namespace: saas-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: saas-provisioner
